/*
# Create core social tables: follows, posts, comments, reactions, saved_posts

## New Tables

### follows
- Tracks follower/following relationships between users
- `follower_id` follows `following_id`
- Unique constraint prevents duplicate follows
- Used to compute follower/following counts from real data

### posts
- Stores all user posts with visibility settings
- `author_id` references the post creator
- `visibility` can be: public, friends, private, friends_except, custom
- `except_user_ids` and `allowed_user_ids` are arrays for custom visibility
- `images`, `videos` are arrays of data URLs (base64)
- `shares`, `views` are counters

### comments
- Stores comments on posts
- `post_id` references the post
- `author_id` references the commenter
- `reply_to_comment_id` for threaded replies
- `attachment_data` stores JSON-encoded attachment

### post_reactions
- Stores reactions (like, love, haha, etc.) per user per post
- Unique constraint on (post_id, user_id) prevents duplicates
- If user changes reaction, the row is updated (not duplicated)

### post_likes
- Simple likes (distinct from reactions — legacy like button)
- Unique on (post_id, user_id)

### saved_posts
- Tracks which users saved which posts
- Unique on (post_id, user_id)

### comment_reactions
- Reactions on comments (same pattern as post_reactions)

## Security
- RLS enabled on all tables with permissive policies (anon + authenticated)
- App uses custom auth, ownership verified in application layer
*/

-- ===================== FOLLOWS =====================
CREATE TABLE IF NOT EXISTS follows (
  id text PRIMARY KEY DEFAULT ('fl_' || gen_random_uuid()::text),
  follower_id text NOT NULL,
  following_id text NOT NULL,
  created_at timestamptz NOT NULL DEFAULT now(),
  UNIQUE (follower_id, following_id)
);

ALTER TABLE follows ENABLE ROW LEVEL SECURITY;
DROP POLICY IF EXISTS "follows_select_all" ON follows;
CREATE POLICY "follows_select_all" ON follows FOR SELECT
  TO anon, authenticated USING (true);
DROP POLICY IF EXISTS "follows_insert_all" ON follows;
CREATE POLICY "follows_insert_all" ON follows FOR INSERT
  TO anon, authenticated WITH CHECK (true);
DROP POLICY IF EXISTS "follows_update_all" ON follows;
CREATE POLICY "follows_update_all" ON follows FOR UPDATE
  TO anon, authenticated USING (true) WITH CHECK (true);
DROP POLICY IF EXISTS "follows_delete_all" ON follows;
CREATE POLICY "follows_delete_all" ON follows FOR DELETE
  TO anon, authenticated USING (true);

CREATE INDEX IF NOT EXISTS idx_follows_follower ON follows (follower_id);
CREATE INDEX IF NOT EXISTS idx_follows_following ON follows (following_id);

-- ===================== POSTS =====================
CREATE TABLE IF NOT EXISTS posts (
  id text PRIMARY KEY DEFAULT ('p_' || gen_random_uuid()::text),
  author_id text NOT NULL,
  text text NOT NULL DEFAULT '',
  images text[] NOT NULL DEFAULT '{}',
  videos text[] NOT NULL DEFAULT '{}',
  visibility text NOT NULL DEFAULT 'public',
  except_user_ids text[] NOT NULL DEFAULT '{}',
  allowed_user_ids text[] NOT NULL DEFAULT '{}',
  shares integer NOT NULL DEFAULT 0,
  views integer NOT NULL DEFAULT 0,
  pinned boolean NOT NULL DEFAULT false,
  edited_at timestamptz,
  created_at timestamptz NOT NULL DEFAULT now()
);

ALTER TABLE posts ENABLE ROW LEVEL SECURITY;
DROP POLICY IF EXISTS "posts_select_all" ON posts;
CREATE POLICY "posts_select_all" ON posts FOR SELECT
  TO anon, authenticated USING (true);
DROP POLICY IF EXISTS "posts_insert_all" ON posts;
CREATE POLICY "posts_insert_all" ON posts FOR INSERT
  TO anon, authenticated WITH CHECK (true);
DROP POLICY IF EXISTS "posts_update_all" ON posts;
CREATE POLICY "posts_update_all" ON posts FOR UPDATE
  TO anon, authenticated USING (true) WITH CHECK (true);
DROP POLICY IF EXISTS "posts_delete_all" ON posts;
CREATE POLICY "posts_delete_all" ON posts FOR DELETE
  TO anon, authenticated USING (true);

CREATE INDEX IF NOT EXISTS idx_posts_author ON posts (author_id);
CREATE INDEX IF NOT EXISTS idx_posts_created ON posts (created_at DESC);

-- ===================== COMMENTS =====================
CREATE TABLE IF NOT EXISTS comments (
  id text PRIMARY KEY DEFAULT ('c_' || gen_random_uuid()::text),
  post_id text NOT NULL,
  author_id text NOT NULL,
  text text NOT NULL DEFAULT '',
  attachment_data jsonb,
  reply_to_comment_id text,
  edited_at timestamptz,
  created_at timestamptz NOT NULL DEFAULT now()
);

ALTER TABLE comments ENABLE ROW LEVEL SECURITY;
DROP POLICY IF EXISTS "comments_select_all" ON comments;
